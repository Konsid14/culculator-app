<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  .calculator {
    width: 340px;
    max-width: 92vw;
    background: #0d0d0d;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .display {
    text-align: right;
    padding: 20px 10px 10px;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .expression {
    color: #a5a5a5;
    font-size: 22px;
    font-weight: 400;
    min-height: 28px;
    word-wrap: break-word;
  }

  .result {
    color: #ffffff;
    font-size: 56px;
    font-weight: 300;
    overflow-x: auto;
    white-space: nowrap;
    margin-top: 4px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 72px;
    gap: 12px;
    margin-top: 12px;
  }

  button {
    border: none;
    outline: none;
    border-radius: 50%;
    width: 100%;
    height: 100%;
    font-size: 26px;
    font-weight: 400;
    color: #ffffff;
    background: #333333;
    cursor: pointer;
    transition: filter 0.1s ease, transform 0.05s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: scale(0.94);
    filter: brightness(1.3);
  }

  .num {
    background: #1c1c1c;
  }

  .op {
    background: #ff9f0a;
    font-size: 30px;
  }

  .zero {
    grid-column: span 2;
    border-radius: 36px;
    text-align: left;
    padding-left: 28px;
  }

  @media (max-width: 380px) {
    .buttons { grid-auto-rows: 60px; }
    .result { font-size: 44px; }
    button { font-size: 22px; }
    .zero { padding-left: 22px; }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="buttons">
    <button class="num" onclick="onClear()">C</button>
    <button class="num" onclick="onPlusMinus()">±</button>
    <button class="num" onclick="onPercent()">%</button>
    <button class="op" onclick="onOperator('÷')">÷</button>

    <button class="num" onclick="onNumber('7')">7</button>
    <button class="num" onclick="onNumber('8')">8</button>
    <button class="num" onclick="onNumber('9')">9</button>
    <button class="op" onclick="onOperator('×')">×</button>

    <button class="num" onclick="onNumber('4')">4</button>
    <button class="num" onclick="onNumber('5')">5</button>
    <button class="num" onclick="onNumber('6')">6</button>
    <button class="op" onclick="onOperator('−')">−</button>

    <button class="num" onclick="onNumber('1')">1</button>
    <button class="num" onclick="onNumber('2')">2</button>
    <button class="num" onclick="onNumber('3')">3</button>
    <button class="op" onclick="onOperator('+')">+</button>

    <button class="num zero" onclick="onNumber('0')">0</button>
    <button class="num" onclick="onDecimal()">.</button>
    <button class="op" onclick="onEquals()">=</button>
  </div>
</div>

<script>
  let display = '0';
  let expression = '';
  let firstOperand = null;
  let pendingOperator = null;
  let shouldResetDisplay = false;

  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');

  function render() {
    resultEl.textContent = display;
    expressionEl.textContent = expression;
  }

  function formatNumber(num) {
    if (!isFinite(num)) return 'Error';
    if (Number.isInteger(num) && Math.abs(num) < 1e12) {
      return num.toString();
    }
    let str = num.toString();
    if (str.replace('-', '').replace('.', '').length > 12) {
      str = parseFloat(num.toPrecision(10)).toString();
    }
    return str;
  }

  function onNumber(n) {
    if (display === '0' || shouldResetDisplay) {
      display = n;
      shouldResetDisplay = false;
    } else {
      const digitsOnly = display.replace('-', '').replace('.', '');
      if (digitsOnly.length < 12) {
        display += n;
      }
    }
    render();
  }

  function onDecimal() {
    if (shouldResetDisplay) {
      display = '0.';
      shouldResetDisplay = false;
    } else if (!display.includes('.')) {
      display += '.';
    }
    render();
  }

  function onOperator(op) {
    if (pendingOperator !== null && !shouldResetDisplay) {
      calculate();
    }
    firstOperand = parseFloat(display);
    pendingOperator = op;
    expression = `${formatNumber(firstOperand)} ${op}`;
    shouldResetDisplay = true;
    render();
  }

  function onEquals() {
    if (pendingOperator !== null && firstOperand !== null) {
      const secondOperand = parseFloat(display);
      expression = `${formatNumber(firstOperand)} ${pendingOperator} ${formatNumber(secondOperand)} =`;
      calculate();
      pendingOperator = null;
      shouldResetDisplay = true;
    }
    render();
  }

  function calculate() {
    if (firstOperand === null || pendingOperator === null) return;
    const secondOperand = parseFloat(display);
    let result;

    switch (pendingOperator) {
      case '+': result = firstOperand + secondOperand; break;
      case '−': result = firstOperand - secondOperand; break;
      case '×': result = firstOperand * secondOperand; break;
      case '÷':
        if (secondOperand === 0) {
          display = 'Error';
          firstOperand = null;
          pendingOperator = null;
          expression = '';
          render();
          return;
        }
        result = firstOperand / secondOperand;
        break;
      default: result = secondOperand;
    }

    display = formatNumber(result);
    firstOperand = result;
  }

  function onClear() {
    display = '0';
    expression = '';
    firstOperand = null;
    pendingOperator = null;
    shouldResetDisplay = false;
    render();
  }

  function onPlusMinus() {
    if (display !== '0' && display !== 'Error') {
      display = display.startsWith('-') ? display.slice(1) : '-' + display;
    }
    render();
  }

  function onPercent() {
    const value = parseFloat(display);
    display = formatNumber(value / 100);
    render();
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') onNumber(e.key);
    else if (e.key === '.') onDecimal();
    else if (e.key === '+') onOperator('+');
    else if (e.key === '-') onOperator('−');
    else if (e.key === '*') onOperator('×');
    else if (e.key === '/') { e.preventDefault(); onOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') onEquals();
    else if (e.key === 'Escape') onClear();
    else if (e.key === 'Backspace') {
      display = display.length > 1 ? display.slice(0, -1) : '0';
      render();
    } else if (e.key === '%') onPercent();
  });

  render();
</script>

</body>
</html>
